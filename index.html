ex;justify-content:space-between;gap:8px;align-items:center;padding:10px 13px;margin:6px 0;background:#f5f7fb;border-radius:12px;font-size:17px;font-weight:750}.review-line.wrong{background:#fff0e8}.review-line .status-ok{color:var(--green)}.review-line .status-no{color:#c86536}.bottom-buttons{display:flex;flex-wrap:wrap;gap:13px;justify-content:center;margin:22px auto 4px}.stat-toggle{margin-top:20px}.stat-panel{margin-top:15px;border-top:1px solid #e0e8f4;padding-top:16px}.stats-list{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}.stats-list td,.stats-list th{text-align:left;border-bottom:1px solid #e3eaf4;padding:9px 5px}.stats-list th{color:#657795}.history-note{font-size:13px;color:#64728f;margin-top:12px}.empty-stats{font-size:14px;color:#8190aa}.stats-header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:9px 0}.stats-header h3{margin:0}.btn-danger{border:1px solid #f1d2d5;color:#b25261;background:white;border-radius:8px;padding:7px 10px;font-size:12px}.noread{color:#bb5e35;font-size:14px;text-align:center;min-height:23px;margin:10px 0 0;font-weight:700}.mode-display{font-size:13px;color:#6980ae;border-radius:8px;background:#eff5ff;padding:5px 10px}.narrow{max-width:720px;margin:auto}footer{text-align:center;font-size:12px;color:#8090ae;margin-top:15px}
@media(max-width:520px){.app{padding:8px 10px 28px}.panel{border-radius:20px;padding:18px 12px}.brand{margin:13px auto}.brand h1{font-size:24px}.brand-mark{width:42px;height:42px}.write-grid{gap:8px}.write-tile{padding:8px 6px}.write-tile .tile-label{font-size:15px}.write-tile .tile-tip{font-size:11px}.pad{border-radius:11px}.question{font-size:58px}.qhint{font-size:16px}.btn{font-size:18px}.summary-grid{gap:5px}.metric{padding:12px 2px}.metric b{font-size:20px}.metric span{font-size:11px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* iPad: keep the question, handwriting spaces, and answer button together in one view. */
@media (min-width:600px){
 .app{padding:7px 12px 10px}
 .brand{margin:3px auto 7px;gap:8px}
 .brand-mark{width:35px;height:35px;border-radius:11px;font-size:23px}
 .brand h1{font-size:26px}
 .brand small{font-size:11px;margin-top:0}
 .narrow{max-width:850px}
 #play{padding:10px 16px 6px;margin-bottom:6px;border-radius:18px}
 #play .page-head{margin-bottom:4px}
 #play .page-head .num{font-size:16px}
 #play .progress{margin:3px 0 8px;gap:4px}
 #play .pip{height:9px}
 #play .question-block{padding:5px 9px;border-radius:14px}
 #play .question{font-size:clamp(48px,8dvh,68px);line-height:1.09}
 #play .qhint{font-size:15px;margin:6px 0 5px}
 #play .write-grid{max-width:560px;gap:11px}
 #play .write-tile{padding:5px 7px 6px;border-radius:14px}
 #play .write-tile .tile-label{font-size:15px;margin:0}
 #play .write-tile .tile-tip{font-size:11px;min-height:14px;line-height:1.25}
 #play .pad{width:min(100%,clamp(145px,26dvh,215px));max-height:none;height:auto;aspect-ratio:1;margin:3px auto;border-radius:11px}
 #play .write-tile .clear{min-height:31px;margin-top:3px;padding:3px 16px}
 #play .noread{min-height:17px;margin:4px 0 1px;font-size:13px}
 #play .actions{margin-top:7px}
 #play .btn{min-height:46px;font-size:18px;padding:7px 16px}
 #play .small-help{margin:4px 0 0;font-size:11px;min-height:17px}
 #play .feedback{margin-top:8px;padding:10px 9px}
 #play .feedback strong{font-size:24px}
 #play .feedback .detail{font-size:15px;margin:4px 0}
 #play .footer-action{margin:0}
 .in-play footer{display:none}
}
/* In landscape or split-screen, prioritize handwriting and controls over decoration. */
@media (min-width:600px) and (max-height:700px){
 .brand{margin:0 auto 4px}.brand-mark{width:30px;height:30px;font-size:20px}
 .brand h1{font-size:22px}.brand small{display:none}
 #play{padding:6px 12px 3px}
 #play .question{font-size:clamp(42px,8dvh,55px)}
 #play .question-block{padding:2px 8px}
 #play .pad{width:min(100%,clamp(130px,23dvh,165px))}
 #play .qhint{margin:3px 0}
 #play .write-tile .tile-tip{min-height:13px}
 #play .write-tile .clear{min-height:28px}
 #play .btn{min-height:41px}
}
/* If Safari uses iPad Split View, keep the same condensed layout. */
@media (max-width:599px){
 .brand{margin:6px auto 8px}
 #play{padding:10px 9px;margin-bottom:5px}
 #play .page-head{margin-bottom:5px}
 #play .progress{margin:5px 0 9px}
 #play .question-block{padding:6px 5px}
 #play .question{font-size:clamp(41px,9dvh,58px)}
 #play .qhint{margin:8px 0 6px}
 #play .write-tile{padding:5px 5px 7px}
 #play .write-tile .tile-tip{font-size:10px;min-height:14px}
 #play .pad{width:min(100%,clamp(120px,23dvh,185px));max-height:none;height:auto;margin:3px auto}
 #play .write-tile .clear{min-height:31px;margin-top:4px}
 #play .actions{margin-top:8px}
 #play .btn{min-height:45px}
 #play .small-help{margin:4px 0 0}
 #play .footer-action{margin:3px 0}
 .in-play footer{display:none}
}

<body>
<div class="app">
<header class="brand"><div class="brand-mark">+</div><div><h1>たしざん チャレンジ</h1><small>てがきで 10もん！</small></div></header>
<main class="narrow">
<section class="panel center" id="home" aria-labelledby="home-title">
<div class="tag">1けた ＋ 1けた</div>
<h2 class="lead" id="home-title">10もん やってみよう！</h2>
<p class="sub">ゆび や ペン で こたえを かいてね。<br>「ファイナルアンサー」で こたえあわせ。</p>
<div class="switch-row"><div><strong>こたえが 10いか だけ</strong><span class="sub">オンにすると 11いじょうの こたえは でません</span></div><label class="switch" aria-label="答えが10以下だけにする"><input id="limit-toggle" type="checkbox" checked role="switch" aria-label="答えが10以下だけの問題にする"><span class="switch-track"></span></label></div>
<button class="btn primary btn-wide" id="start-btn">スタート！</button>
<div class="stat-toggle"><button class="btn soft mini" id="home-stats-btn" aria-expanded="false">これまでの きろく</button></div>
<div id="home-stats" class="stat-panel hidden"></div>
</section>
<section class="panel hidden" id="play" aria-label="たし算の問題">
<div class="page-head"><div class="num"><span id="question-number">1</span> <span style="font-size:14px;color:#7282a1">/ 10もん</span></div><span class="mode-display" id="mode-indicator"></span></div>
<div class="progress" id="progress" aria-label="10問の進み具合"></div>
<div class="question-block"><div class="question" aria-live="polite"><span id="left-number"></span><span class="plus">＋</span><span id="right-number"></span><span class="equals">＝</span><span style="color:#476fd8">？</span></div></div>
<div class="qhint">こたえを かこう！</div>
<div class="write-grid">
<div class="write-tile"><span class="tile-label">10のくらい</span><span class="tile-tip">1けたのときは かかない</span><canvas class="pad" id="pad-tens" width="300" height="300" tabindex="0" aria-label="10のくらいの数字を書く場所"></canvas><button class="clear" id="clear-tens">ここを けす</button></div>
<div class="write-tile ones"><span class="tile-label">1のくらい</span><span class="tile-tip">ここに かいてね</span><canvas class="pad" id="pad-ones" width="300" height="300" tabindex="0" aria-label="1のくらいの数字を書く場所"></canvas><button class="clear" id="clear-ones">ここを けす</button></div>
</div>
<div id="message" class="noread" aria-live="polite"></div>
<div id="write-actions" class="actions"><button class="btn green btn-wide" id="final-btn">ファイナルアンサー！</button><p class="small-help">かきまちがえたら「ここを けす」を おしてね。</p></div>
<div id="feedback" class="feedback hidden" role="status"><strong id="feedback-title"></strong><div class="detail" id="feedback-detail"></div><button class="btn primary btn-wide" id="next-btn">つぎの もんだい →</button><div><button class="change" id="retry-btn">すうじの よみとりが ちがう とき</button></div></div>
<div class="footer-action"><button class="link-button" id="giveup-btn">とちゅうで おわる</button></div>
</section>
<section class="panel hidden center" id="result" aria-label="結果">
<div class="tag">10もん しゅうりょう！</div><div class="result-icon" aria-hidden="true">★</div>
<h2 class="lead" style="margin-top:0">おつかれさま！</h2>
<div class="score" id="final-score"></div><div class="scoreline" id="final-line"></div>
<div class="summary-grid"><div class="metric"><b id="percent"></b><span>せいかいりつ</span></div><div class="metric"><b id="ave-time"></b><span>1もんの へいきん</span></div><div class="metric"><b id="best-score"></b><span>これまでの さいこう</span></div></div>
<div class="review" id="review"></div>
<p class="lead" style="font-size:20px">つぎは どうする？</p>
<div class="bottom-buttons"><button class="btn primary" id="continue-btn">もう 10もん！</button><button class="btn soft" id="quit-btn">おわる</button></div>
<div class="stat-toggle"><button class="btn soft mini" id="result-stats-btn" aria-expanded="false">ぜんぶの とうけいを みる</button></div>
<div id="result-stats" class="stat-panel hidden"></div>
</section>
</main><footer>てがきの データは そとに おくりません</footer>
</div>

let gamePads = {};
let history = [];
const saved = (key, fallback) => {try {const raw=localStorage.getItem(key);return raw===null ? fallback : JSON.parse(raw)} catch(e){return fallback}};
const save = (key,value) => {try {localStorage.setItem(key,JSON.stringify(value))}catch(e){}};
const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function prepClassifier(){
 if(train)return;
 const n=LABEL_DATA.length; train=new Uint8Array(n*64);trainNorms=new Float32Array(n);
 for(let i=0;i<n;i++){
  let sum=0;for(let j=0;j<64;j++){const v=parseInt(TEMPLATE_DATA.charAt(i*64+j),16);train[i*64+j]=v;sum+=v*v}
  trainNorms[i]=Math.sqrt(sum)||1;
 }
}
function vectorFromPad(canvas){
 const context=canvas.getContext('2d',{willReadFrequently:true});
 const {width:w,height:h}=canvas,px=context.getImageData(0,0,w,h).data;
 let minX=w,minY=h,maxX=-1,maxY=-1,count=0;
 for(let y=0;y<h;y+=1)for(let x=0;x<w;x+=1){const a=px[(y*w+x)*4+3];if(a>24){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);count++}}
 if(maxX<0 || count<20)return null;
 const ww=maxX-minX+1,hh=maxY-minY+1;
 // 8x8に縮める際、縦7マス、横6マス以内に収めて周囲に余白を残す。
 const scale=Math.min(6/ww,7/hh),dw=ww*scale,dh=hh*scale;
 const temp=document.createElement('canvas');temp.width=8;temp.height=8;
 const c=temp.getContext('2d',{willReadFrequently:true});
 c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
 c.drawImage(canvas,minX,minY,ww,hh,(8-dw)/2,(8-dh)/2,dw,dh);
 const ar=c.getImageData(0,0,8,8).data;
 const out=new Float32Array(64);let max=0;
 for(let i=0;i<64;i++){out[i]=ar[i*4+3]*16/255;if(out[i]>max)max=out[i]}
 if(max<.1)return null;
 const gain=Math.min(4.3,16/max);
 for(let i=0;i<64;i++)out[i]=Math.min(16,out[i]*gain);
 return out;
}
function classifyPad(canvas){
 const vec=vectorFromPad(canvas);if(!vec)return null;
 prepClassifier();
 let norm=0;for(let j=0;j<64;j++)norm+=vec[j]*vec[j];norm=Math.sqrt(norm);
 if(norm<1)return null;
 // 画像の形で比較。照明、筆圧や線の太さの影響を減らすためコサイン類似度を採用。
 const bestScores=new Float64Array(10);const bestFound=new Int32Array(10);const n=LABEL_DATA.length;
 for(let i=0;i<n;i++){
  let dot=0,off=i*64;
  for(let j=0;j<64;j++)dot+=vec[j]*train[off+j];
  const sim=dot/(norm*trainNorms[i]);
  const d=LABEL_DATA.charCodeAt(i)-48;
  if(sim>bestScores[d]){bestScores[d]=sim;bestFound[d]=i}
 }
 // A small, limited allowance for children's handwritten 4 and 9.
 // Keep the image-based result independent of the arithmetic question's correct answer.
 const adjusted=Float64Array.from(bestScores);
 adjusted[4]+=0.013;
 adjusted[9]+=0.012;
 let best=0;
 for(let j=1;j<10;j++)if(adjusted[j]>adjusted[best])best=j;
 // A 4 may have a joined triangle. Preserve its characteristic horizontal
 // middle bar when comparing it to a similar-looking 1 or 9.
 let middleBar=false;
 for(let y=3;y<=5;y++){
  let run=0;
  for(let x=1;x<=6;x++){
   run=vec[y*8+x]>=4.5?run+1:0;
   if(run>=4){middleBar=true;break;}
  }
  if(middleBar)break;
 }
 if(middleBar && best!==4 && adjusted[4]>adjusted[best]-0.018){
  best=4;
 }
 return {digit:best,confidence:bestScores[best],alternates:Array.from({length:10},(_,d)=>({d,s:adjusted[d]})).sort((a,b)=>b.s-a.s).slice(0,3)};
}
function makePad(canvas,eraseButton){
 const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#263763';ctx.lineWidth=16;
 let active=false,lastX=0,lastY=0;
 const xy=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};
 canvas.addEventListener('pointerdown',e=>{
  if(state.phase!=='writing')return;
  e.preventDefault();canvas.setPointerCapture(e.pointerId);
  const pt=xy(e);active=true;lastX=pt.x;lastY=pt.y;
  ctx.beginPath();ctx.arc(pt.x,pt.y,ctx.lineWidth/2,0,2*Math.PI);ctx.fillStyle='#263763';ctx.fill();
  eraseButton.disabled=false;$('message').textContent='';
 });
 canvas.addEventListener('pointermove',e=>{
  if(!active||state.phase!=='writing')return;
  e.preventDefault();const pt=xy(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(pt.x,pt.y);ctx.stroke();lastX=pt.x;lastY=pt.y;
 });
 const end=e=>{if(active){active=false;try{canvas.releasePointerCapture(e.pointerId)}catch(err){}}};
 canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',()=>active=false);
 eraseButton.addEventListener('click',()=>{if(state.phase!=='writing')return;ctx.clearRect(0,0,canvas.width,canvas.height);eraseButton.disabled=true;$('message').textContent=''});
 eraseButton.disabled=true;
 return {clear:()=>{ctx.clearRect(0,0,canvas.width,canvas.height);eraseButton.disabled=true},btn:eraseButton};
}
function show(page){['home','play','result'].forEach(name=>$(name).classList.toggle('hidden',name!==page));document.body.classList.toggle('in-play',page==='play');state.phase=page==='play'?'writing':page;window.scrollTo(0,0);}
function shuffle(items){for(let i=items.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[items[i],items[k]]=[items[k],items[i]]}return items;}
function makeQuestions(under10){const pool=[];for(let a=0;a<=9;a++)for(let b=a;b<=9;b++){if(!under10||a+b<=10)pool.push({a,b});}return shuffle(pool).slice(0,10).map(({a,b})=>Math.random()<.5?{a,b}:{a:b,b:a});}
function startGame(){state.mode=$('limit-toggle').checked;save(modeKey,state.mode);state.questions=makeQuestions(state.mode);state.index=0;state.answers=[];show('play');$('mode-indicator').textContent=state.mode?'こたえは 10いか':'こたえは 18まで';loadQuestion();}
function loadQuestion(){const q=state.questions[state.index];state.phase='writing';$('question-number').textContent=String(state.index+1);$('left-number').textContent=String(q.a);$('right-number').textContent=String(q.b);$('feedback').classList.add('hidden');$('write-actions').classList.remove('hidden');$('message').textContent='';gamePads.tens.clear();gamePads.ones.clear();['clear-tens','clear-ones'].forEach(id=>$(id).disabled=false);paintProgress();state.startedAt=performance.now();}
function paintProgress(){const el=$('progress');el.innerHTML='';for(let j=0;j<10;j++){const pip=document.createElement('span');pip.className='pip';if(j<state.answers.length)pip.classList.add(state.answers[j].correct?'good':'bad');else if(j===state.index)pip.classList.add('current');el.appendChild(pip)}}
function beep(freq,t,duration,vol=0.09,wave='sine'){
 const ctx=audioContext;if(!ctx)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(vol,t+.016);gain.gain.exponentialRampToValueAtTime(.001,t+duration);osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+duration+.02);
}
function sound(correct){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!audioContext)audioContext=new Audio();if(audioContext.state==='suspended')audioContext.resume();const t=audioContext.currentTime+.02;if(correct){beep(523,t,.17,.08);beep(659,t+.14,.20,.08);beep(784,t+.29,.35,.09);}else{beep(390,t,.14,.045,'triangle');beep(330,t+.18,.22,.038,'triangle');}}catch(e){}}
function finalAnswer(){if(state.phase!=='writing')return;const ones=classifyPad($('pad-ones')),tens=classifyPad($('pad-tens'));
 if(!ones){$('message').textContent='「1のくらい」に すうじを かいてね！';return}
 if(tens && tens.digit>1){$('message').textContent='「10のくらい」は 0か1で かいてね。';return}
 const entered=(tens?tens.digit*10:0)+ones.digit;
 const q=state.questions[state.index],right=q.a+q.b,correct=entered===right;
 const seconds=Math.max(1,Math.round((performance.now()-state.startedAt)/1000));state.answers.push({a:q.a,b:q.b,entered,right,correct,seconds});
 state.phase='feedback';sound(correct);$('feedback').classList.toggle('no',!correct);$('feedback-title').textContent=correct?'せいかい！':'おしい！';
 $('feedback-detail').textContent=correct?`${q.a} ＋ ${q.b} ＝ ${right}　よくできたね！`:`よみとった こたえ：${entered}　｜　ただしい こたえ：${right}`;
 $('next-btn').textContent=state.index===9?'けっかを みる →':'つぎの もんだい →';
 $('write-actions').classList.add('hidden');$('feedback').classList.remove('hidden');['clear-tens','clear-ones'].forEach(id=>$(id).disabled=true);paintProgress();
}
function next(){if(state.phase!=='feedback')return;if(state.index<9){state.index++;loadQuestion();}else finishGame()}
function retryRead(){if(state.phase!=='feedback')return;state.answers.pop();state.phase='writing';$('feedback').classList.add('hidden');$('write-actions').classList.remove('hidden');gamePads.tens.clear();gamePads.ones.clear();$('message').textContent='もう いちど かいてね。';paintProgress();}
function finishGame(){const score=state.answers.filter(r=>r.correct).length;const round={at:new Date().toISOString(),mode:state.mode,score,answers:state.answers.map(x=>({...x}))};history.push(round);if(history.length>500)history=history.slice(-500);save(historyKey,history);renderResult(round);show('result');}
function durationText(secs){return secs>=60?`${Math.floor(secs/60)}ふん${secs%60}びょう`:`${secs}びょう`}
function renderResult(round){const s=round.score,total=round.answers.length;const sec=Math.round(round.answers.reduce((a,x)=>a+x.seconds,0)/total);
 $('final-score').innerHTML=`${s}<small> / 10てん</small>`;$('final-line').textContent=s===10?'ぜんもん せいかい！':s>=8?'とても よく がんばりました！':s>=5?'できた もんだいが ふえたね！':'まちがえた もんだいを れんしゅう しよう！';
 $('percent').textContent=`${s*10}%`;$('ave-time').textContent=durationText(sec);$('best-score').textContent=`${Math.max(...history.map(x=>x.score),s)}てん`;
 const review=$('review');review.innerHTML='<h3>10もんの こたえあわせ</h3>';
 round.answers.forEach((r,i)=>{const row=document.createElement('div');row.className='review-line '+(r.correct?'':'wrong');row.innerHTML=`<span>${i+1}.　${r.a} ＋ ${r.b} ＝ ${r.right}</span><span class="${r.correct?'status-ok':'status-no'}">${r.correct?'○':'× かいたこたえ '+r.entered}</span>`;review.append(row)});
 $('result-stats').classList.add('hidden');$('result-stats-btn').setAttribute('aria-expanded','false');
}
function renderStats(node){if(!history.length){node.innerHTML='<p class="empty-stats">まだ きろくが ありません。10もん やってみよう！</p>';return}
 const count=history.length,tries=history.reduce((sum,r)=>sum+r.answers.length,0),correct=history.reduce((sum,r)=>sum+r.score,0),best=Math.max(...history.map(r=>r.score));
 const acc=Math.round(correct/tries*100);const last=history.slice(-10).reverse();
 const byQ=new Map();for(const round of history)for(const a of round.answers){const key=[a.a,a.b].sort((x,y)=>x-y).join('+');const x=byQ.get(key)||{a:Math.min(a.a,a.b),b:Math.max(a.a,a.b),wrong:0,tries:0};x.tries++;if(!a.correct)x.wrong++;byQ.set(key,x)}
 const hard=[...byQ.values()].filter(x=>x.wrong>0).sort((x,y)=>y.wrong-x.wrong||y.wrong/y.tries-x.wrong/x.tries).slice(0,5);
 node.innerHTML=`<div class="stats-header"><h3>これまでの とうけい</h3><button class="btn-danger" data-clear-history>きろくを けす</button></div><div class="summary-grid"><div class="metric"><b>${count}かい</b><span>10もんチャレンジ</span></div><div class="metric"><b>${acc}%</b><span>ぜんたいの せいかいりつ</span></div><div class="metric"><b>${best}/10</b><span>さいこうとくてん</span></div></div><p class="history-note">ぜんぶで ${tries}もん、${correct}もん せいかい！</p><h3>まちがえやすい もんだい</h3>${hard.length?`<div>${hard.map(x=>`<div class="review-line wrong"><span>${x.a} ＋ ${x.b}</span><small>${x.wrong}かい / ${x.tries}かい</small></div>`).join('')}</div>`:'<p class="empty-stats">まちがえた もんだいは ありません。</p>'}<h3>さいきんの 10かい</h3><table class="stats-list"><thead><tr><th>ひづけ</th><th>もんだい</th><th>とくてん</th></tr></thead><tbody>${last.map(r=>`<tr><td>${new Date(r.at).toLocaleDateString('ja-JP')}</td><td>${r.mode?'10いか':'ぜんぶ'}</td><td><strong>${r.score}/10</strong></td></tr>`).join('')}</tbody></table>`;
 node.querySelector('[data-clear-history]').addEventListener('click',()=>{if(confirm('これまでの きろくを ぜんぶ けしますか？')){history=[];save(historyKey,history);renderStats(node)}})
}
function toggleStats(place,button){const el=$(place);const open=el.classList.toggle('hidden')===false;$(button).setAttribute('aria-expanded',String(open));if(open)renderStats(el)}
function init(){history=saved(historyKey,[]);if(!Array.isArray(history))history=[];state.mode=saved(modeKey,true)!==false;$('limit-toggle').checked=state.mode;
 gamePads.tens=makePad($('pad-tens'),$('clear-tens'));gamePads.ones=makePad($('pad-ones'),$('clear-ones'));
 $('start-btn').addEventListener('click',startGame);$('final-btn').addEventListener('click',finalAnswer);$('next-btn').addEventListener('click',next);$('retry-btn').addEventListener('click',retryRead);
 $('continue-btn').addEventListener('click',()=>{startGame()});$('quit-btn').addEventListener('click',()=>{show('home');$('home-stats').classList.add('hidden');$('home-stats-btn').setAttribute('aria-expanded','false')});
 $('giveup-btn').addEventListener('click',()=>{if(confirm('10もん おわるまえに やめますか？\nいまの きろくは のこりません。'))show('home')});
 $('home-stats-btn').addEventListener('click',()=>toggleStats('home-stats','home-stats-btn'));
 $('result-stats-btn').addEventListener('click',()=>toggleStats('result-stats','result-stats-btn'));
}
init();
</script>
</body>
</html>
