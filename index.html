<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9f4ff">
<title>たしざん チャレンジ｜すうじボタン</title>
<style>
:root { --ink:#27375d; --muted:#687a96; --primary:#346ce1; --green:#18835f; --line:#dce5f6; }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; min-height:100vh; background:linear-gradient(145deg,#e7f4ff,#f9f7ff 55%,#fff2e6); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; }
button,input { font:inherit; } button { cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent; } button:focus-visible { outline:3px solid #ffaf51;outline-offset:3px; } button:disabled { opacity:.5;cursor:not-allowed; }
.hidden { display:none!important; }
.app { width:min(100%,780px);margin:auto;padding:10px 14px 14px; }
.brand { display:flex;gap:10px;justify-content:center;align-items:center;margin:2px auto 10px; }
.brand-mark { display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#ffdc8c;color:#8b5313;font-size:29px;font-weight:900;transform:rotate(-7deg); }
h1 { margin:0;font-size:clamp(23px,4vw,29px);letter-spacing:.02em;line-height:1.2; }
.brand small { color:#687a96;font-size:12px; }
.panel { background:rgba(255,255,255,.97);border:1px solid #fff;box-shadow:0 10px 30px #40578317;border-radius:24px;padding:24px;margin-bottom:6px; }
.center { text-align:center; }.tag { display:inline-block;background:#eaf1ff;color:#385eb7;padding:7px 16px;border-radius:99px;font-size:15px;font-weight:850; }
h2 { font-size:clamp(22px,4vw,30px);margin:15px 0 9px; }
.sub { font-size:16px;line-height:1.8;color:var(--muted); }
.switch-row { display:flex;align-items:center;justify-content:space-between;gap:14px;background:#f2f6ff;padding:17px 20px;margin:24px auto 18px;max-width:590px;border-radius:16px;text-align:left; }
.switch-row strong { display:block;font-size:19px; }.switch-row .sub { display:block;font-size:13px;line-height:1.5; }
.switch { flex-shrink:0;position:relative;width:66px;height:40px; }
.switch input { position:absolute;z-index:1;inset:0;margin:0;opacity:0;cursor:pointer;width:100%;height:100%; }
.switch-track { display:block;width:100%;height:100%;border-radius:40px;background:#b9c7dd;position:relative;transition:.2s; }
.switch-track:before { content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 7px #0002;transition:.2s; }
.switch input:checked+.switch-track { background:#477ce9; }.switch input:checked+.switch-track:before { transform:translateX(26px); }
.btn { border:0;border-radius:15px;padding:12px 23px;min-height:52px;font-weight:850;font-size:20px; }
.btn-primary { background:#3979eb;color:#fff;box-shadow:0 4px 0 #2457b3; }.btn-green { background:#188f66;color:#fff;box-shadow:0 4px 0 #116647; }.btn-soft { background:#eaf0fd;color:#385783; }.btn-wide { width:min(100%,410px); }.btn-mini { padding:9px 16px;min-height:40px;font-size:15px; }
.stats-switch { margin-top:19px; }.stat-panel { border-top:1px solid var(--line);margin-top:15px;padding-top:13px; }
/* 1問画面 */
#play { padding:12px 18px 8px; }
.page-head { display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:850;margin-bottom:6px; }
.mode { background:#ecf3ff;border-radius:9px;padding:6px 10px;color:#5d76a4;font-size:13px; }
.progress { display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-bottom:10px; }
.pip { height:10px;border-radius:9px;background:#e5edfa; }.pip.active { background:#8fb0ff; }.pip.correct { background:#37ae85; }.pip.wrong { background:#edaa7c; }
.question-panel { text-align:center;padding:8px 6px;background:linear-gradient(120deg,#f1f7ff,#f8f3ff);border-radius:18px; }
.question { font-size:clamp(50px,8dvh,78px);font-weight:950;line-height:1.1;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap; }
.plus { color:#ee8751; }.equals { color:#6084bb; }.mark { color:#416ed9; }
.answer-label { text-align:center;color:#5b6e91;font-size:15px;font-weight:800;margin:9px 0 3px; }
.answer-box { display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto;max-width:300px;min-height:65px;border:3px solid #b8cffa;border-radius:17px;background:#f6faff; }
.answer-value { font-size:clamp(36px,6dvh,50px);font-weight:950;min-width:85px;line-height:1.1;font-variant-numeric:tabular-nums;color:#2e5fc9; }
.answer-value.empty { color:#a6b5d0; }.answer-suffix { font-weight:800;font-size:16px;color:#8798b5; }
.keypad { display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;max-width:590px;margin:11px auto 0; }
.key { border:2px solid #aec8f7;background:#e7f0ff;color:#244c9c;border-radius:14px;min-height:68px;padding:0;font-size:clamp(27px,5vw,40px);font-weight:900;box-shadow:0 3px 0 #c2d4f4; }
.key:active { background:#c9defc;transform:translateY(2px);box-shadow:0 1px 0 #bdccdf; }
.edit-keys { display:flex;gap:10px;justify-content:center;max-width:590px;margin:10px auto 0; }
.edit-keys button { flex:1;min-height:44px;background:#f0f3fa;color:#576c92;border:1px solid #dfe6f2;border-radius:11px;font-size:16px;font-weight:800; }
.actions { text-align:center;margin-top:12px; }.actions .btn { min-height:56px; }
.notice { text-align:center;font-weight:800;color:#b05e26;font-size:14px;min-height:18px;margin:4px 0 0; }
.feedback { max-width:590px;margin:14px auto 0;text-align:center;background:#e6faee;border:2px solid #bde5d1;border-radius:16px;padding:13px; }
.feedback.no { background:#fff5e9;border-color:#f3d7b9; }.feedback strong { display:block;font-size:28px; }.feedback .detail { font-size:17px;font-weight:750;margin:8px 0 14px; }
.feedback .btn { width:min(100%,400px); }.footer-action { display:flex;justify-content:flex-end;margin-top:5px; }
.link-button { border:0;background:transparent;color:#7a89a3;padding:6px;font-size:13px;text-decoration:underline; }
/* 成績 */
.score { font-size:clamp(58px,10vw,95px);color:#3774e2;font-weight:950;line-height:1.2;margin:9px 0 4px; }.score small { font-size:26px;color:#5b6c8c; }
.scoreline { font-weight:800;font-size:18px;color:#52688f; }
.summary-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;max-width:630px;margin:18px auto; }
.metric { border-radius:15px;background:#f0f5ff;padding:14px 6px; }.metric b { display:block;font-size:22px;color:#2d5db0; }.metric span { font-size:12px;color:#607494; }
.review { text-align:left;max-width:590px;margin:20px auto; }.review h3,.stat-panel h3 { font-size:17px; }
.review-line { display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 13px;margin:6px 0;background:#f2f6fe;border-radius:11px;font-weight:800; }
.review-line.wrong { background:#fff0e7; }.status-ok { color:#198462; }.status-no { color:#b4592b; }
.bottom-buttons { display:flex;gap:13px;flex-wrap:wrap;justify-content:center;margin:15px 0; }
.stats-header { display:flex;align-items:center;justify-content:space-between;gap:8px; }.stats-header h3 { margin:0; }
.btn-danger { border:1px solid #f0c6cc;border-radius:10px;background:white;color:#b24d63;font-size:13px;padding:8px; }
.history-note,.empty-stats { font-size:14px;color:#677995; }.stats-list { width:100%;border-collapse:collapse;font-size:14px;text-align:left; }.stats-list td,.stats-list th { padding:9px 4px;border-bottom:1px solid var(--line); }
footer { font-size:12px;color:#8a9bb4;text-align:center;margin-top:10px; }
@media (max-width:540px) { .app { padding:8px 9px; } .panel { padding:17px 12px; } #play { padding:10px 10px 6px; }.brand { margin-bottom:8px; }.brand-mark { width:35px;height:35px;font-size:23px; } h1 { font-size:22px; }.keypad { gap:6px; }.key { min-height:58px;border-radius:10px; }.answer-box { min-height:60px; }.question { font-size:clamp(42px,9vw,66px); }.edit-keys { gap:6px; }.switch-row { padding:12px; } }
/* iPadを横向きにしたときも下のボタンを画面内に出す */
@media (min-width:600px) and (max-height:760px) { .app { padding:5px 10px 6px; }.brand { margin:1px auto 5px; }.brand-mark { width:31px;height:31px;font-size:22px; }h1 { font-size:23px; }.brand small { display:none; }#play { padding:8px 14px 5px; }.page-head { margin-bottom:4px;font-size:15px; }.progress { margin-bottom:5px; }.pip { height:7px; }.question-panel { padding:3px 6px; }.question { font-size:52px; }.answer-label { margin:4px 0 2px;font-size:14px; }.answer-box { min-height:52px; }.answer-value { font-size:39px; }.keypad { margin-top:6px;gap:6px; }.key { min-height:51px;font-size:29px; }.edit-keys { margin-top:6px; }.edit-keys button { min-height:37px; }.actions { margin-top:7px; }.actions .btn { min-height:47px; }.feedback { padding:8px;margin-top:7px; }.feedback strong { font-size:22px; }.feedback .detail { margin:3px 0 7px; }.footer-action { margin:2px 0 0; }body.in-play footer { display:none; } }
@media (max-height:600px) { .brand small { display:none; } .brand { margin-bottom:3px; }.key { min-height:44px; }.actions .btn { min-height:44px; }.question { font-size:46px; }.answer-box { min-height:46px; }.answer-value { font-size:34px; }#play { padding-top:6px; }.notice { min-height:12px; }.edit-keys button { min-height:34px; } }
@media (prefers-reduced-motion:reduce) { *,*:before { transition:none!important; } }
</style>
</head>
<body>
<div class="app">
<header class="brand"><div class="brand-mark" aria-hidden="true">＋</div><div><h1>たしざん チャレンジ</h1><small>すうじボタンで 10もん！</small></div></header>
<main>
<section id="home" class="panel center" aria-labelledby="home-title">
 <div class="tag">1けた ＋ 1けた</div>
 <h2 id="home-title">10もん やってみよう！</h2>
 <p class="sub">0から9の ボタンを おしてね。<br>「ファイナルアンサー！」で こたえあわせ。</p>
 <div class="switch-row"><div><strong>こたえが 10いか だけ</strong><span class="sub">オン：こたえが 0〜10の もんだいだけ</span></div>
  <label class="switch" aria-label="答えを10以下に限定"><input id="limit-toggle" type="checkbox" role="switch" checked aria-label="こたえが10以下だけ"><span class="switch-track"></span></label></div>
 <button id="start-btn" type="button" class="btn btn-primary btn-wide">スタート！</button>
 <div class="stats-switch"><button id="home-stats-btn" type="button" class="btn btn-soft btn-mini" aria-expanded="false">これまでの きろく</button></div>
 <div id="home-stats" class="stat-panel hidden"></div>
</section>
<section id="play" class="panel hidden" aria-label="たしざんの問題">
 <div class="page-head"><span><span id="question-number">1</span> / 10もん</span><span id="mode-indicator" class="mode"></span></div>
 <div id="progress" class="progress" aria-label="10問の進み具合"></div>
 <div class="question-panel"><div class="question" aria-live="polite"><span id="left-number"></span><span class="plus"> ＋ </span><span id="right-number"></span><span class="equals"> ＝ </span><span class="mark">？</span></div></div>
 <div class="answer-label">こたえ</div>
 <div class="answer-box" aria-label="選んだ答え"><span id="answer-display" class="answer-value empty" aria-live="polite">？</span><span class="answer-suffix" aria-hidden="true"></span></div>
 <div id="entry-controls">
  <div id="keypad" class="keypad" role="group" aria-label="数字を選ぶボタン">
   <button class="key" type="button" data-digit="0">0</button><button class="key" type="button" data-digit="1">1</button><button class="key" type="button" data-digit="2">2</button><button class="key" type="button" data-digit="3">3</button><button class="key" type="button" data-digit="4">4</button>
   <button class="key" type="button" data-digit="5">5</button><button class="key" type="button" data-digit="6">6</button><button class="key" type="button" data-digit="7">7</button><button class="key" type="button" data-digit="8">8</button><button class="key" type="button" data-digit="9">9</button>
  </div>
  <div class="edit-keys"><button id="backspace-btn" type="button">← 1もじ けす</button><button id="clear-btn" type="button">ぜんぶ けす</button></div>
  <div id="message" class="notice" role="status" aria-live="polite"></div>
  <div class="actions"><button id="final-btn" class="btn btn-green btn-wide" type="button">ファイナルアンサー！</button></div>
 </div>
 <div id="feedback" class="feedback hidden" role="status" aria-live="polite"><strong id="feedback-title"></strong><div id="feedback-detail" class="detail"></div><button id="next-btn" class="btn btn-primary btn-wide" type="button">つぎの もんだい →</button></div>
 <div class="footer-action"><button id="giveup-btn" class="link-button" type="button">とちゅうで おわる</button></div>
</section>
<section id="result" class="panel hidden center" aria-label="チャレンジの結果">
 <div class="tag">10もん しゅうりょう！</div><h2>おつかれさま！</h2><div id="final-score" class="score"></div><div id="final-line" class="scoreline"></div>
 <div class="summary-grid"><div class="metric"><b id="percent"></b><span>せいかいりつ</span></div><div class="metric"><b id="ave-time"></b><span>1もんの へいきん</span></div><div class="metric"><b id="best-score"></b><span>これまでの さいこう</span></div></div>
 <div id="review" class="review"></div><h2 style="font-size:21px">つぎは どうする？</h2>
 <div class="bottom-buttons"><button id="continue-btn" type="button" class="btn btn-primary">もう 10もん！</button><button id="quit-btn" type="button" class="btn btn-soft">おわる</button></div>
 <div class="stats-switch"><button id="result-stats-btn" class="btn btn-soft btn-mini" type="button" aria-expanded="false">ぜんぶの とうけいを みる</button></div><div id="result-stats" class="stat-panel hidden"></div>
</section>
</main>
<footer>ボタンしき｜きろくは この ききに ほぞんされます</footer>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
// 手書き認識で誤採点された旧データと区別するため、記録を新しく始めます。
const historyKey='tashizan-button-history-v1';
const modeKey='tashizan-challenge-mode-v1';
const saved=(key,fallback)=>{try{const raw=localStorage.getItem(key);return raw===null?fallback:JSON.parse(raw)}catch(e){return fallback}};
const save=(key,val)=>{try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}};
let history=saved(historyKey,[]);if(!Array.isArray(history))history=[];
let audioContext=null;
let state={mode:true,questions:[],index:0,answers:[],phase:'home',startedAt:0,entry:''};
function show(page){for(const id of ['home','play','result'])$(id).classList.toggle('hidden',id!==page);document.body.classList.toggle('in-play',page==='play');state.phase=page==='play'?'answering':page;window.scrollTo(0,0);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeQuestions(under10){const pool=[];for(let a=0;a<=9;a++)for(let b=a;b<=9;b++)if(!under10||a+b<=10)pool.push({a,b});return shuffle(pool).slice(0,10).map(q=>Math.random()<.5?q:{a:q.b,b:q.a});}
function startGame(){state.mode=$('limit-toggle').checked;save(modeKey,state.mode);state.questions=makeQuestions(state.mode);state.index=0;state.answers=[];show('play');$('mode-indicator').textContent=state.mode?'こたえは 10いか':'こたえは 18まで';loadQuestion();}
function updateEntry(){const el=$('answer-display');el.textContent=state.entry===''?'？':state.entry;el.classList.toggle('empty',state.entry==='');$('backspace-btn').disabled=state.entry==='';$('clear-btn').disabled=state.entry==='';}
function loadQuestion(){const q=state.questions[state.index];state.phase='answering';state.entry='';$('question-number').textContent=state.index+1;$('left-number').textContent=q.a;$('right-number').textContent=q.b;$('feedback').classList.add('hidden');$('entry-controls').classList.remove('hidden');$('message').textContent='';updateEntry();paintProgress();state.startedAt=performance.now();}
function paintProgress(){const el=$('progress');el.replaceChildren();for(let i=0;i<10;i++){const pip=document.createElement('span');pip.className='pip';if(i<state.answers.length)pip.classList.add(state.answers[i].correct?'correct':'wrong');else if(i===state.index)pip.classList.add('active');el.append(pip)}}
function pressDigit(d){if(state.phase!=='answering')return;let newEntry=state.entry==='0'?String(d):state.entry+String(d);if(newEntry.length>2||Number(newEntry)>18){$('message').textContent='18までの すうじを えらんでね';return;}state.entry=newEntry;$('message').textContent='';updateEntry();}
function backspace(){if(state.phase!=='answering')return;state.entry=state.entry.slice(0,-1);$('message').textContent='';updateEntry();}
function clearEntry(){if(state.phase!=='answering')return;state.entry='';$('message').textContent='';updateEntry();}
function beep(freq,t,duration,volume=.075,wave='sine'){if(!audioContext)return;const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.001,t);gain.gain.linearRampToValueAtTime(volume,t+.017);gain.gain.exponentialRampToValueAtTime(.001,t+duration);osc.connect(gain).connect(audioContext.destination);osc.start(t);osc.stop(t+duration+.03);}
function sound(correct){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!audioContext)audioContext=new Audio();if(audioContext.state==='suspended')audioContext.resume();const t=audioContext.currentTime+.02;if(correct){beep(523,t,.17);beep(659,t+.14,.2);beep(784,t+.30,.3);}else{beep(390,t,.14,.045,'triangle');beep(330,t+.17,.23,.04,'triangle');}}catch(e){}}
function finalAnswer(){if(state.phase!=='answering')return;if(state.entry===''){$('message').textContent='すうじを おしてから こたえあわせしてね';return;}const q=state.questions[state.index],entered=Number(state.entry),right=q.a+q.b,correct=entered===right;const seconds=Math.max(1,Math.round((performance.now()-state.startedAt)/1000));state.answers.push({a:q.a,b:q.b,entered,right,correct,seconds});state.phase='feedback';sound(correct);$('feedback').classList.toggle('no',!correct);$('feedback-title').textContent=correct?'せいかい！':'おしい！';$('feedback-detail').textContent=correct?`${q.a} ＋ ${q.b} ＝ ${right}　よくできたね！`:`あなたの こたえ：${entered}　｜　ただしい こたえ：${right}`;$('next-btn').textContent=state.index===9?'けっかを みる →':'つぎの もんだい →';$('entry-controls').classList.add('hidden');$('feedback').classList.remove('hidden');paintProgress();}
function next(){if(state.phase!=='feedback')return;if(state.index<9){state.index++;loadQuestion();}else finishGame();}
function finishGame(){const score=state.answers.filter(x=>x.correct).length;const round={at:new Date().toISOString(),mode:state.mode,score,answers:state.answers.map(x=>({...x}))};history.push(round);if(history.length>500)history=history.slice(-500);save(historyKey,history);renderResult(round);show('result');}
function durationText(t){return t>=60?`${Math.floor(t/60)}ふん${t%60}びょう`:`${t}びょう`;}
function renderResult(round){const s=round.score,total=round.answers.length;const secs=Math.round(round.answers.reduce((a,x)=>a+x.seconds,0)/total);$('final-score').innerHTML=`${s}<small> / 10てん</small>`;$('final-line').textContent=s===10?'ぜんもん せいかい！':s>=8?'とても よく がんばりました！':s>=5?'できた もんだいが ふえたね！':'まちがえた もんだいを れんしゅう しよう！';$('percent').textContent=`${s*10}%`;$('ave-time').textContent=durationText(secs);$('best-score').textContent=`${Math.max(...history.map(x=>x.score),s)}てん`;
 const review=$('review');review.innerHTML='<h3>10もんの こたえあわせ</h3>';round.answers.forEach((r,i)=>{const row=document.createElement('div');row.className='review-line'+(r.correct?'':' wrong');const left=document.createElement('span'),right=document.createElement('span');left.textContent=`${i+1}.　${r.a} ＋ ${r.b} ＝ ${r.right}`;right.className=r.correct?'status-ok':'status-no';right.textContent=r.correct?'○':`× こたえ ${r.entered}`;row.append(left,right);review.append(row);});$('result-stats').classList.add('hidden');$('result-stats-btn').setAttribute('aria-expanded','false');}
function renderStats(node){if(!history.length){node.innerHTML='<p class="empty-stats">まだ きろくが ありません。10もん やってみよう！</p>';return;}
 const count=history.length,tries=history.reduce((n,r)=>n+r.answers.length,0),correct=history.reduce((n,r)=>n+r.score,0),best=Math.max(...history.map(r=>r.score));const acc=Math.round(correct/tries*100);const last=history.slice(-10).reverse();const byQ=new Map();for(const round of history)for(const a of round.answers){const key=[a.a,a.b].sort((x,y)=>x-y).join('+');const q=byQ.get(key)||{a:Math.min(a.a,a.b),b:Math.max(a.a,a.b),wrong:0,tries:0};q.tries++;if(!a.correct)q.wrong++;byQ.set(key,q);}const hard=[...byQ.values()].filter(x=>x.wrong).sort((x,y)=>y.wrong-x.wrong||(y.wrong/y.tries-x.wrong/x.tries)).slice(0,5);
 node.innerHTML=`<div class="stats-header"><h3>これまでの とうけい</h3><button class="btn-danger" data-clear-history type="button">きろくを けす</button></div><div class="summary-grid"><div class="metric"><b>${count}かい</b><span>10もんチャレンジ</span></div><div class="metric"><b>${acc}%</b><span>ぜんたいの せいかいりつ</span></div><div class="metric"><b>${best}/10</b><span>さいこうとくてん</span></div></div><p class="history-note">ぜんぶで ${tries}もん、${correct}もん せいかい！</p><h3>まちがえやすい もんだい</h3>${hard.length?hard.map(x=>`<div class="review-line wrong"><span>${x.a} ＋ ${x.b}</span><small>${x.wrong}かい / ${x.tries}かい</small></div>`).join(''):'<p class="empty-stats">まちがえた もんだいは ありません。</p>'}<h3>さいきんの 10かい</h3><table class="stats-list"><thead><tr><th>ひづけ</th><th>もんだい</th><th>とくてん</th></tr></thead><tbody>${last.map(r=>`<tr><td>${new Date(r.at).toLocaleDateString('ja-JP')}</td><td>${r.mode?'10いか':'ぜんぶ'}</td><td><b>${r.score}/10</b></td></tr>`).join('')}</tbody></table>`;
 node.querySelector('[data-clear-history]').addEventListener('click',()=>{if(confirm('これまでの きろくを ぜんぶ けしますか？')){history=[];save(historyKey,history);renderStats(node);}});}
function toggleStats(panel,btn){const el=$(panel),open=el.classList.toggle('hidden')===false;$(btn).setAttribute('aria-expanded',String(open));if(open)renderStats(el);}
function init(){state.mode=saved(modeKey,true)!==false;$('limit-toggle').checked=state.mode;$('start-btn').addEventListener('click',startGame);$('keypad').addEventListener('click',e=>{const b=e.target.closest('button[data-digit]');if(b)pressDigit(b.dataset.digit)});$('backspace-btn').addEventListener('click',backspace);$('clear-btn').addEventListener('click',clearEntry);$('final-btn').addEventListener('click',finalAnswer);$('next-btn').addEventListener('click',next);$('continue-btn').addEventListener('click',startGame);$('quit-btn').addEventListener('click',()=>{show('home');$('home-stats').classList.add('hidden');$('home-stats-btn').setAttribute('aria-expanded','false');});$('giveup-btn').addEventListener('click',()=>{if(confirm('10もん おわるまえに やめますか？\nいまの きろくは のこりません。'))show('home');});$('home-stats-btn').addEventListener('click',()=>toggleStats('home-stats','home-stats-btn'));$('result-stats-btn').addEventListener('click',()=>toggleStats('result-stats','result-stats-btn'));}
init();
</script>
</body>
</html>
